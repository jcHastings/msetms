name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # Repo-wide `npm run lint` still fails on pre-existing stacked-tip issues.
      # Gate this BFF on the Driver API surface.
      - run: npx eslint lib/driver-api.ts lib/driver-ops.ts lib/driver-actions.ts lib/db.ts lib/driver-login-fixture.ts lib/fuel-receipt-match.ts lib/fuel-receipts.ts lib/fuel-import.ts lib/fuel-import-http.ts lib/samsara-routes-shared.ts lib/integrations/samsara-routes.ts lib/trailer-custody.ts lib/trailer-custody-shared.ts lib/rate-con-redact.ts lib/rate-con-redact-money.ts lib/rate-con-redact-store.ts lib/rate-con-redact-access.ts lib/rate-con-redact-actions.ts lib/files.ts components/trailer-custody-panel.tsx components/trailer-drop-form.tsx components/rate-con-page-zoom.tsx components/rate-con-redaction-panel.tsx app/fleet/trailers/custody/page.tsx app/api/driver app/api/fuel/import app/api/rate-con-redactions app/driver/loads --max-warnings 0
